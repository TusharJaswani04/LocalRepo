<!DOCTYPE html>
<html>
    <head>
        <meta name = "viewport" content="width=device-width,initial-scale=1.0"></meta>
        <link rel = "stylesheet" href = "style.css"/>
        <link rel = "icon" type = "image/x-icon" href = "favicon.ico"/>
    </head>
    <body align = "center">
        <!--
        Methods Types:
        
                     get                  |        post
        Not Secure                        | Secure
        Open data Underline               | Appends data inside body
        Size limitation(2048 characters)  | No Size Limitation
        can be bookmarked                 | Cannot be bookmarked
        -->
        <form action = "#" method = "get" enctype = "multipart/form-data">
            <fieldset>                                         
                <legend align = "center">LJU Form</legend>
                <!-- For UserName Field -->
                <label for="uname">UserName</label>
                <input type="text" autofocus autocomplete required placeholder = "placeholder" id ="uname"/>
                <!-- In this type of input, the inputed data text will not be assigned to URL(else all field data will be as assigned as syntax) -->
                
                <!-- for Password Field --> <br><br><br>
                  <!--disabled , readonly attributes are used to lock, read function respectively  -->
                  <!-- value attribute is used to set the value in column by default -->
                 <label> Password <input type = "password" maxlength="8" minlength="3" value="123" ></label>
                
                
                 <!-- Email Field --> <br><br><br>
                 <label for="email"> Email </label>
                 <input type="email" name = "mail">
            
                <!-- Age Field --> <br><br><br> 
                <label> Age <input type = "number" max = "20" min = "12" name = "age"></label>

                <!-- Price Field --> <br><br><br>
                 <label> Price <input type="range" min="20" max="200" name="price" value="50" step = "5" oninput="num.value=this.value"/></label>

                <!-- attributes can be, FOR temporary solution-->
                <input type = "text" id = "num" disabled>


                <!-- For DOB value --> <br><br><br>
                  <label> DOB <input type = "date" name = "dob" min = "2000-10-01" ></label>

                <!-- For Gender Field --> <br><br><br>
                   <label> Gender <input type="radio" name = "gender" value = "Male" checked /> Male <input type="radio" name = "gender" value = "Female" checked > Female </label>

                <!-- Subject Field --> <br><br><br>

                <!-- checked attribute is used to set default checked field -->
                <label>Subjects<input type="checkbox" name = "subject" value = "FSD" checked/>FSD-1
                    <input type="checkbox" name = "subject" value = "DE"/> DE
                    <input type="checkbox" name = "subject" value = "PYTHON"/>PYTHON
                    <input type="checkbox" name = "subject" value = "PS"/> PS
                </label>

                <!-- Search Field --> <br><br><br>
                 <label> Search <input type="search" name = "s"></label>

                 <!-- Department -->  <br><br><br>
                 <label > Department <select name = "department">
                                    <option value="" selected disabled hidden>Select Department</option>
                                    
                                    <optgroup label="CE">
                                        <option value="CSE">CSE</option>
                                        <option value="CSD">CSD</option>
                                        <option value="CEA">CEA</option>
                                    </optgroup>
                                    
                                    <optgroup label = "Mechanical">
                                    <option value="CAD">CAD</option>
                                    <option value="CAM">CAM</option>
                                    </optgroup>
                                </select>
                 </label>

                <!-- Comments --> <br><br><br>
                <label> Comments <textarea name="comments" rows="6" cols="20"></textarea></label>


                <!-- File field --> <br><br><br>
                 <label> File <input type = "file" name = "f1" multiple></label>

                 <br><br><br>
                 <input type="image" src = "1.jpg" width = "200" height="200" alt = "photo"/>
                 <br><br><br>
                 <input type = "button" value = "Button Submit"/>
                 <input type="reset" value="ResetData"/>

                 <button> Button Click </button>



                <!-- for submit button --> <br><br><br>
                <input type="submit" value = "submit form"> 
            </fieldset>

    </body>
</html>
